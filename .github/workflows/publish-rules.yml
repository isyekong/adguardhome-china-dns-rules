name: 生成 AdGuard Home 分流规则

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-rules.yml]
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'

permissions:
  contents: write

concurrency:
  group: publish-adguardhome-rules

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载并转换域名列表
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output china.conf \
            https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const domains = new Set();
          const label = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
          let skipped = 0;
          for (const line of readFileSync('china.conf', 'utf8').split(/\r?\n/)) {
            const entry = line.trim();
            if (!entry || entry.startsWith('#')) continue;

            const domain = /^server=\/([^/]+)\/[^/\s]+$/.exec(entry)?.[1].toLowerCase();
            if (!domain || domain.length > 253 || !domain.split('.').every(part => label.test(part))) {
              skipped++;
              continue;
            }
            domains.add(domain);
          }

          if (domains.size < 1000 || !domains.has('cn') || !domains.has('baidu.com')) {
            throw new Error(`Unexpected source list: ${domains.size} valid domains`);
          }

          const lines = [
            'https://cloudflare-dns.com/dns-query',
            '# Source: felixonmars/dnsmasq-china-list (WTFPL-2.0)',
            ...[...domains].sort().map(domain => `[/${domain}/]https://doh.pub/dns-query https://dns.alidns.com/dns-query`),
          ];
          writeFileSync('upstreams.txt', lines.join('\n') + '\n', 'utf8');
          console.log(`Generated ${domains.size} rules; skipped ${skipped} unsupported lines.`);
          NODE

      - name: 发布规则文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(sha256sum upstreams.txt | cut -d ' ' -f 1)
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq 'map(select(.draft == false and .prerelease == false)) | .[0].assets[]? | select(.name == "upstreams.txt") | .digest // empty')
          if [[ "$previous" == "sha256:$digest" ]]; then
            echo 'The published rules are up to date.'
            exit 0
          fi

          gh release create "rules-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" upstreams.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "DNS 规则 $(TZ=Asia/Shanghai date +%F)" \
            --notes '域名来源为 [dnsmasq-china-list](https://github.com/felixonmars/dnsmasq-china-list)。清单内域名走腾讯 DNSPod 或阿里公共 DNS 的 DoH，其余走 Cloudflare DoH。'
